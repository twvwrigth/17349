<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API FETCH</title>
</head>
<body>
    <h1>API FETCH</h1>
    <button onclick="llamar()">Fetch</button>
    <button onclick="llamar2()">AJAX</button>
    <button onclick="llamar3()">Fetch async/await</button>

    <script>
        function llamar() {
            let url = "https://jsonplaceholder.typicode.com/users/1";
            let parametros = ""
            fetch(url)
            .then(respuesta => {
                console.log(respuesta);
                datos= respuesta.json();
                console.log(datos);
                return datos;
            })
            .then(datos =>{
                console.log(datos);
            })
            .catch(error => {
                console.log(error);
            });

        }

        function llamar3() {
            let url = "https://jsonplaceholder.typicode.com/users/1";
            let parametros = ""
            fetch(url)
            .then(async respuesta => {
                console.log(respuesta);
                datos= await respuesta.json();
                console.log(datos);
                return datos;
            })
            .catch(error => {
                console.log(error);
            });

        }

        function llamar2(){
            var xhttp = new XMLHttpRequest();
            xhttp.onload = respuesta => {
                console.log(JSON.parse(xhttp.responseText));
            };
            xhttp.open("GET", "https://jsonplaceholder.typicode.com/users/1", true);
            xhttp.send();
        }
    </script>
</body>
</html>
