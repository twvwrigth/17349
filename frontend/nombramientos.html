<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nombramientos</title>
</head>
<body>
    <h1>Nombramientos</h1>
    <button onclick="Npost()">Post</button>
    <button onclick="Nput()">Puh</button>
    <button onclick="Ndelete()">Deleh</button>

    <script>
        let url = "http://localhost:8081/Nombramientos"
        function Npost(){
            fetch(url,{
                method : "POST"
            })
            .then(respuesta=>{
                return respuesta.text()
            })
            .then(datos=> {
                console.log(datos)
            })
            .catch(error=>{
                console.log(error)
            })
        }
        function Nput(){
            fetch(url,{
                method : "PUT"
            })
            .then(respuesta=>{
                return respuesta.text()
            })
            .then(datos=> {
                console.log(datos)
            })
            .catch(error=>{
                console.log(error)
            })
        }
        function Ndelete(){
            fetch(url,{
                method : "DELETE"
            })
            .then(respuesta=>{
                return respuesta.text()
            })
            .then(datos=> {
                console.log(datos)
            })
            .catch(error=>{
                console.log(error)
            })
        }
    </script>
</body>
</html>
